<!doctype html>
<html lang="zh-CN">

    <title>凡尘问道</title>
    <style>

en)}.item{border:1px solid var(--line);border-radius:3px;padding:9px 11px;background:#fffdf8}.item.eq{border-color:var(--red);background:#fdf3ee}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.tag{font-size:11px;padding:0 6px;border-radius:2px;background:#f0e9da;color:var(--ink-soft)}.tag.up{color:var(--green);background:#e8f0e9}.tag.down{color:var(--red);background:#f6e6e2}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.center-title{font-family:Songti SC,STSong,serif;font-size:17px;margin-bottom:6px}textarea{width:100%;min-height:120px;font-family:ui-monospace,Consolas,monospace;font-size:12px;border:1px solid var(--line-strong);border-radius:3px;padding:8px;background:#fffdf8;color:var(--ink)}.banner{background:#fbf1ef;border:1px solid var(--red);color:var(--red);border-radius:3px;padding:8px 12px;margin-bottom:12px;font-size:13px}@media (max-width: 980px){.page{grid-template-columns:minmax(0,1fr)}.nav{position:static;flex-direction:row;flex-wrap:wrap;overflow-x:auto}.nav button{white-space:nowrap}}

与规矩都报了给你。"}},wh=[{id:"jh_sword_1",kind:"event",title:"断碑旁的旧剑",text:"官道拐弯处立着半截断碑，碑脚的新土里露出一角铁。拨开浮土，是一柄断了半截的剑，剑格上刻着一个很小的记号——你在柳青那柄剑上见过同样的刻法。",regions:["heifeng"],routes:["road"],nodes:[3],directed:!0,forbidFlags:["jh_sword_1"],weight:0,options:[{id:"keep",label:"把断剑收起来",hint:"先留着，不声张",setFlags:["jh_sword_1","jh_sword_keep"],relation:{who:"liuqing",value:2},text:"你用布条把断剑裹好，收进包袱。这样的旧物，不该扔在路边给人踩。"},{id:"ask",label:"带去镇上问人",hint:"不藏私，先问清来历",setFlags:["jh_sword_1","jh_sword_ask"],text:"你没有急着收起来，而是记下碑上的字，打算回镇上问问铁匠与旧书铺——来历清楚，才好处置。"},{id:"leave",label:"把土掩回去",hint:"记下位置，日后再来",text:"你把浮土重新盖好，压了块石头做记号。这事不急在一时。"}]},{id:"jh_sword_2",kind:"event",title:"城南的铁匠",text:"你按记号找到城南的老铁匠。他捏着断剑看了很久，手一直在抖：“这剑是我师父打的。当年那桩事，我能作证——只是我徒弟明日要去渡口，路上不太平。”",regions:["heifeng"],routes:["road"],nodes:[3],directed:!0,requireFlags:["jh_sword_1"],forbidFlags:["jh_sword_2"],weight:0,options:[{id:"escort",label:"护送他的徒弟去渡口",hint:"一战",battle:"e_daoke",winFlags:["jh_sword_2","jh_sword_escort"],winText:"刀客退走。老铁匠把当年的账目抄本塞进你手里：“拿去吧，字是我写的，我认。”",relation:{who:"liuqing",value:2},text:"你送铁匠的徒弟出镇。官道拐角，两个提刀的人拦住了路口。"},{id:"relic",label:"把断剑拿给他看",hint:"你手上就有旧物，他不疑有他",visibleIfFlags:["jh_sword_keep"],setFlags:["jh_sword_2","jh_sword_relic"],relation:{who:"liuqing",value:2},text:"断剑一放在案上，老铁匠就退了半步。他抹了把脸：“当年送剑出去的人，姓柳。这话我搁了三十年，今天说出来，心里倒松快。”"},{id:"ledger",label:"请他抄一份旧账簿",hint:"镇上问来的说法与他对得上",visibleIfFlags:["jh_sword_ask"],setFlags:["jh_sword_2","jh_sword_ledger"],relation:{who:"liuqing",value:1},text:"你说起镇上问来的那几条说法，老铁匠听着听着点了头，翻出压箱底的旧账簿，把与那批剑有关的两页抄给了你。"},{id:"trust",label:"请他说出当年那个名字",hint:"需柳青人情6",require:{minRelation:{who:"liuqing",value:6}},setFlags:["jh_sword_2","jh_sword_promise"],relation:{who:"liuqing",value:3},text:"你报了柳青的名字。老铁匠沉默半晌，才说：“当年送剑出去的人，不是他爹，是他师叔。”这句话，他只说给你听。"},{id:"wait",label:"先不惊动他",hint:"此事急不得",text:"你把断剑收了回去。老铁匠看了你一眼，没再多说。"}]},{id:"jh_sword_3",kind:"event",title:"还剑",text:"断剑、证词都在你手上。柳青在城北旧祠堂等你，镇上的差役也在打听这桩旧案，还有个外乡来的古玩商，愿意为这柄剑出一笔不小的价钱。",regions:["heifeng"],routes:["road"],nodes:[3],directed:!0,requireFlags:["jh_sword_2"],forbidFlags:["jh_sword_3"],weight:0,options:[{id:"return",label:"把断剑交还柳青",hint:"此事到此为止（此选将定下结局）",setFlags:["jh_sword_3","jh_sword_end_return"],relation:{who:"liuqing",value:2},schedule:{event:"jh_sword_ret_return",delay:1},text:"你把断剑放到他手边。柳青没有立刻去接，只是长久地看着剑格上的记号。"},{id:"public",label:"请差役当众记下证词",hint:"旧案公开（此选将定下结局）",setFlags:["jh_sword_3","jh_sword_end_public"],schedule:{event:"jh_sword_ret_public",delay:1},text:"你把证词交给了差役，请他在碑前当众记下。来看的人不少，柳青站在最外一圈，没有说话。"},{id:"sell",label:"让古玩商把剑带走",hint:"得一笔现钱（此选将定下结局）",setFlags:["jh_sword_3","jh_sword_end_sell"],relation:{who:"liuqing",value:-2},schedule:{event:"jh_sword_ret_sell",delay:1},text:"古玩商付下定钱，说余款回镇上交割。他抱着剑走远时，柳青还在祠堂门口站着。"}]},{id:"jh_garden_1",kind:"event",title:"荒了的药圃",text:"山径尽头有一片被藤蔓盖住的药垄，界石上还刻着一个模糊的“药”字。垄里残着几株老根，看长势，是有人特意留下没挖的。",regions:["yunwu"],routes:["trail"],nodes:[3],directed:!0,forbidFlags:["jh_garden_1"],weight:0,options:[{id:"sample",label:"取一株样根",hint:"带回去给认得的人看",setFlags:["jh_garden_1","jh_garden_sample"],relation:{who:"yaopo",value:2},text:"你只取了一株最靠边的老根，其余原样掩好。药婆看根须就能认出这是不是她的手笔。"},{id:"protect",label:"先把藤蔓拨开",hint:"不取样，只护住根",setFlags:["jh_garden_1","jh_garden_protect"],text:"你把缠在老根上的藤蔓一根根解开，又把垄沟的水引开。做完这些，天已经暗了，你没取走任何东西。"},{id:"leave",label:"站了一会儿就走",hint:"还没想好怎么处置",text:"你在界石前站了一会儿，退出山径。"}]},{id:"jh_garden_2",kind:"event",title:"抢药的人",text:"雾里有人影在挖药。打头的那人背着药商的旗号，说这片圃早被买下了。一个采药人拦在垄前，被推倒在泥里。远处水响，像有什么大物正顺着沼沟游过来。",regions:["yunwu"],routes:["trail"],nodes:[3],directed:!0,requireFlags:["jh_garden_1"],forbidFlags:["jh_garden_2"],weight:0,options:[{id:"beast",label:"先去拦沼沟里的东西",hint:"一战",battle:"e_mang",winFlags:["jh_garden_2","jh_garden_beast"],winText:"蟒尸沉进沼里。采药人连滚带爬地刨出了垄边的老根，塞了一截给你。",relation:{who:"yaopo",value:2},text:"你挡在垄前，沼沟里的水花已经翻到脚边。"},{id:"seed",label:"指出哪一株是母本",hint:"你手上有样根，说得清",visibleIfFlags:["jh_garden_sample"],setFlags:["jh_garden_2","jh_garden_seed"],relation:{who:"yaopo",value:2},text:"你把样根举起来，说这一片是分株出来的，母本只有两株，挖走就绝了。药商的人将信将疑，到底只挑了几捆普通药材，骂骂咧咧地走了。"},{id:"roots",label:"护住整片根土",hint:"你早先拨开的藤条还在",visibleIfFlags:["jh_garden_protect"],setFlags:["jh_garden_2","jh_garden_roots"],text:"你早先疏开的垄沟救了急——水退得快，根没有烂。采药人从泥里爬起来，把挖开的土一捧捧填回去。"},{id:"trust",label:"报出药婆的名号",hint:"需药婆人情6",require:{minRelation:{who:"yaopo",value:6}},setFlags:["jh_garden_2","jh_garden_trust"],relation:{who:"yaopo",value:3},text:"你说起这圃是谁开的。领头的顿了顿，回头瞪了手下一眼：“分株的母本留下。”他们只抬走了两捆寻常药材。"},{id:"wait",label:"退到雾里再看",hint:"眼下不宜动手",text:"你退回雾中。人影挖了一阵，抬着几捆药材走了。"}]},{id:"jh_garden_3",kind:"event",title:"药种归处",text:"样根、老根都在你手上。药婆托你拿个主意：这些药种，是配成药散给镇上人用，是留在地里慢慢复育，还是整圃卖给上门收药的药材商。",regions:["yunwu"],routes:["trail"],nodes:[3],directed:!0,requireFlags:["jh_garden_2"],forbidFlags:["jh_garden_3"],weight:0,options:[{id:"people",label:"配成药散济民",hint:"药婆的意思（此选将定下结局）",setFlags:["jh_garden_3","jh_garden_end_people"],relation:{who:"yaopo",value:2},schedule:{event:"jh_garden_ret_people",delay:1},text:"你把老根洗净晾上。药婆说，这一片圃当年就是为镇上人种的。"},{id:"grow",label:"留种复育",hint:"不急着用（此选将定下结局）",setFlags:["jh_garden_3","jh_garden_end_grow"],schedule:{event:"jh_garden_ret_grow",delay:1},text:"你按药婆指的法子，把根埋回原垄，覆上湿泥。来年的事，来年再说。"},{id:"sell",label:"整圃卖给药材商",hint:"得一笔现钱（此选将定下结局）",setFlags:["jh_garden_3","jh_garden_end_sell"],relation:{who:"yaopo",value:-2},schedule:{event:"jh_garden_ret_sell",delay:1},text:"药材商当场称了斤两。药婆站在门口看着，一句话也没有说。"}]},{id:"jh_cargo_1",kind:"event",title:"石阶下的货箱",text:"官道边的石阶下翻着一辆旧车，箱子摔开了角。封条上商会的印记被人用刀刮过，箱底还压着半张契书的边角。",regions:["luoxia"],routes:["road"],nodes:[3],directed:!0,forbidFlags:["jh_cargo_1"],weight:0,options:[{id:"seal",label:"查验封条",hint:"记下换封的手法",setFlags:["jh_cargo_1","jh_cargo_seal"],relation:{who:"carter",value:2},text:"你比对了两处印记：刮痕底下的旧印是商会正记，新的那层却歪了半分。换封的人手法不熟。"},{id:"visit",label:"去驿铺问旁证",hint:"问清这车货的来路",setFlags:["jh_cargo_1","jh_cargo_visit"],text:"驿铺的老人记得这辆车：押车的是个生面孔，货却报的是商会的号。你把这些记在心里。"},{id:"leave",label:"绕开这堆烂木头",hint:"与你无关",text:"你从石阶另一侧绕了过去。"}]},{id:"jh_cargo_2",kind:"event",title:"拦路的人",text:"你带着查来的消息往回走，路上被人截住。对方不问你姓名，只问那半张契书在谁手上。石阶高处有什么东西在缓缓转动——是遗迹里才有的机关家伙。",regions:["luoxia"],routes:["road"],nodes:[3],directed:!0,requireFlags:["jh_cargo_1"],forbidFlags:["jh_cargo_2"],weight:0,options:[{id:"guard",label:"先护住同来的人",hint:"一战",battle:"e_jiguan",winFlags:["jh_cargo_2","jh_cargo_guard"],winText:"机关家伙散在地上。截路的人退得比谁都快——他们的底细，你算是看清了。",relation:{who:"carter",value:2},text:"你把车夫推到身后。石阶上的东西咔咔作响，朝你转了过来。"},{id:"proof",label:"把封条的事说给他们听",hint:"你手上有换封的凭据",visibleIfFlags:["jh_cargo_seal"],setFlags:["jh_cargo_2","jh_cargo_proof"],relation:{who:"carter",value:2},text:"你说出换封的两处破绽，又点明旧印是商会正记。对方互相看了看，说是“认错人了”，退下石阶。"},{id:"words",label:"用驿铺的说法周旋",hint:"口供对得上，他们不敢动手",visibleIfFlags:["jh_cargo_visit"],setFlags:["jh_cargo_2","jh_cargo_words"],text:"你把驿铺听见的号头、人手、日子一一说出。截路的人听得脸色发沉——这些事外人本不该知道。他们没再拦。"},{id:"trust",label:"报出商会的字号",hint:"需商会车夫人情6",require:{minRelation:{who:"carter",value:6}},setFlags:["jh_cargo_2","jh_cargo_trust"],relation:{who:"carter",value:3},text:"你报出车夫那一帮人的字号。截路的人对视一眼，拱了拱手退开——行里抬头不见低头见，他们不愿把事做绝。"},{id:"wait",label:"退回石阶下",hint:"先避其锋",text:"你退下石阶。上头的人没有追。"}]},{id:"jh_cargo_3",kind:"event",title:"货归何处",text:"契书、凭据都在你手上。商会的管事、等货的原主、还有当初押车的那一伙人，都等着你开口。这一车货的去处，由你定。",regions:["luoxia"],routes:["road"],nodes:[3],directed:!0,requireFlags:["jh_cargo_2"],forbidFlags:["jh_cargo_3"],weight:0,options:[{id:"owner",label:"原样偿还原主",hint:"按契书办事（此选将定下结局）",setFlags:["jh_cargo_3","jh_cargo_end_owner"],relation:{who:"carter",value:2},schedule:{event:"jh_cargo_ret_owner",delay:1},text:"你把货点清，按契书上的名字交给了原主。管事想说什么，被你一眼看住。"},{id:"settle",label:"议价和解",hint:"各让一步（此选将定下结局）",setFlags:["jh_cargo_3","jh_cargo_end_settle"],schedule:{event:"jh_cargo_ret_settle",delay:1},text:"你把两边的人叫到一处，货折价分了，旧账各自勾掉。事情不算漂亮，但没人再闹。"},{id:"share",label:"按行里的规矩分佣",hint:"你也能分一份（此选将定下结局）",setFlags:["jh_cargo_3","jh_cargo_end_share"],relation:{who:"carter",value:-2},schedule:{event:"jh_cargo_ret_share",delay:1},text:"你说按行价抽佣，货归押车那一伙人处置。车夫张了张嘴，到底没说话。"}]},{id:"jh_res_sand",kind:"event",title:"旧窑",text:"半塌的旧窑口积着一层青黑的铁砂，抓一把在手里，沉甸甸的。窑里没人，只有风吹过破窑口的声音。",regions:["heifeng"],routes:["trail"],nodes:[3],directed:!0,forbidFlags:["jh:sand_done"],weight:0,options:[{id:"take",label:"装两袋走",hint:"铁砂2",setFlags:["jh:sand_done"],gain:{materials:{iron_sand:2}},text:"你筛掉浮土，装了两袋上好的铁砂。这样的料，铁匠见了会点头。"},{id:"leave",label:"先记下这里",hint:"下次再来取",text:"你把窑口的位置记牢。砂不会跑，人却可能没空。"}]},{id:"jh_res_herb",kind:"event",title:"浅湾倒木",text:"倒木的阴面生着一株灵芝，颜色很正，看样子没人动过。水声轻，四下无人。",regions:["yunwu"],routes:["road"],nodes:[3],directed:!0,forbidFlags:["jh:herb_done"],weight:0,options:[{id:"take",label:"采下来",hint:"灵芝1",setFlags:["jh:herb_done"],gain:{materials:{lingzhi:1}},text:"你贴着木纹下刀，整株取下，根上没有伤。"},{id:"leave",label:"先留着它",hint:"下次再来采",text:"你看了看天色，没有动手。再长几日，药性更好。"}]},{id:"jh_res_shard",kind:"event",title:"侧廊塌口",text:"侧廊塌了一角，砖缝里嵌着几片带灵光的残片，边缘锋利，敲上去有极轻的响声。",regions:["luoxia"],routes:["trail"],nodes:[3],directed:!0,forbidFlags:["jh:shard_done"],weight:0,options:[{id:"take",label:"起出残片",hint:"遗迹残片1",setFlags:["jh:shard_done"],gain:{materials:{ruin_shard:1}},text:"你用刀尖一点点撬开砖缝，起出一片完整的残片，包好收进怀里。"},{id:"leave",label:"先不动它",hint:"下次再来取",text:"砖缝咬得很紧，硬撬容易碎。你记下位置，退了出来。"}]},{id:"jh_sword_ret_return",kind:"event",title:"柳青来取剑",text:"柳青在客栈楼下等你，手里提着一只旧剑鞘——鞘是空的，长短正合那柄断剑。",regions:[],town:!0,scheduled:!0,weight:0,requireFlags:["jh_sword_end_return"],options:[{id:"accept",label:"把断剑交给他",hint:"此事到此为止",require:{notFlag:"jh:sword_paid"},gain:{xp:30,silver:20},relation:{who:"liuqing",value:4},setFlags:["jh:sword_paid"],text:"他接过断剑，用袖子把剑身擦了擦，插回鞘里。“这是我师父的。”他顿了顿，“多谢你替我把它找回来。”"}]},{id:"jh_sword_ret_public",kind:"event",title:"差役问案",text:"镇上的差役找上门来，说那桩旧案要立个文卷，请你把证词再说一遍，按个手印。",regions:[],town:!0,scheduled:!0,weight:0,requireFlags:["jh_sword_end_public"],options:[{id:"accept",label:"照实说一遍",hint:"旧案立卷",require:{notFlag:"jh:sword_paid"},gain:{xp:30,silver:40},relation:{who:"liuqing",value:1},setFlags:["jh:sword_paid"],text:"差役把旧案重新立了卷。柳青的名字写在上头，不再是个“来路不明”的人。他远远朝你拱了拱手，没有过来。"}]},{id:"jh_sword_ret_sell",kind:"event",title:"古玩商的余款",text:"古玩商在镇口等着，把余下的银钱数给你，又问你还有没有“那样的旧东西”。",regions:[],town:!0,scheduled:!0,weight:0,requireFlags:["jh_sword_end_sell"],options:[{id:"accept",label:"收下银钱",hint:"钱货两清",require:{notFlag:"jh:sword_paid"},gain:{xp:30,silver:60},relation:{who:"liuqing",value:-2},setFlags:["jh:sword_paid"],text:"你把钱收好。此后柳青再没跟你提过那柄剑，见了面也只点点头。"}]},{id:"jh_garden_ret_people",kind:"event",title:"药婆的方子",text:"药婆把配好的药分包好，摞了一桌子，托你给镇上几家送去。",regions:[],town:!0,scheduled:!0,weight:0,requireFlags:["jh_garden_end_people"],options:[{id:"accept",label:"替她送药",hint:"镇上人都记着这份情",require:{notFlag:"jh:garden_paid"},gain:{xp:30,silver:20},relation:{who:"yaopo",value:4},setFlags:["jh:garden_paid"],text:"你跑了半个镇子。药婆在后头喊：“慢些走，别摔了。”——那语气，像在说自家晚辈。"}]},{id:"jh_garden_ret_grow",kind:"event",title:"留种",text:"药婆把种根埋回院角的土里，浇了水，说等来年再看。",regions:[],town:!0,scheduled:!0,weight:0,requireFlags:["jh_garden_end_grow"],options:[{id:"accept",label:"帮她把土翻好",hint:"长远的事",require:{notFlag:"jh:garden_paid"},gain:{xp:30,silver:40},relation:{who:"yaopo",value:1},setFlags:["jh:garden_paid"],text:"你替她把院角的土翻松，又把水沟理直。药婆说，这圃若是活了，往后镇上人吃药就不必等货船。"}]},{id:"jh_garden_ret_sell",kind:"event",title:"药材商结账",text:"药材商在药铺门口等你，把整圃的价钱结清，还问往后有没有同样的货。",regions:[],town:!0,scheduled:!0,weight:0,requireFlags:["jh_garden_end_sell"],options:[{id:"accept",label:"收下货款",hint:"钱货两清",require:{notFlag:"jh:garden_paid"},gain:{xp:30,silver:60},relation:{who:"yaopo",value:-2},setFlags:["jh:garden_paid"],text:"你数了钱，把药铺的门带上。药婆坐在里屋，没有出来送你。"}]},{id:"jh_cargo_ret_owner",kind:"event",title:"原主来了",text:"商会的老账房带着原主找来，要当面谢你——那半张契书上的印，他认得。",regions:[],town:!0,scheduled:!0,weight:0,requireFlags:["jh_cargo_end_owner"],options:[{id:"accept",label:"受他这一谢",hint:"货归原主",require:{notFlag:"jh:cargo_paid"},gain:{xp:30,silver:20},relation:{who:"carter",value:4},setFlags:["jh:cargo_paid"],text:"老账房把谢银推过来，又当众说了句“按契书办事，这人靠得住”。车夫在门口听着，腰杆挺得笔直。"}]},{id:"jh_cargo_ret_settle",kind:"event",title:"两下清账",text:"两边的人把账清了，各写了一张字据，请你做个见证。",regions:[],town:!0,scheduled:!0,weight:0,requireFlags:["jh_cargo_end_settle"],options:[{id:"accept",label:"签字作证",hint:"折中收场",require:{notFlag:"jh:cargo_paid"},gain:{xp:30,silver:40},relation:{who:"carter",value:1},setFlags:["jh:cargo_paid"],text:"你在两张字据上按了手印。事情不算漂亮，但往后谁也说不出谁的不是。"}]},{id:"jh_cargo_ret_share",kind:"event",title:"分佣",text:"按行里的规矩，这趟货的佣钱分了下来，管事把属于你的那一份送来。",regions:[],town:!0,scheduled:!0,weight:0,requireFlags:["jh_cargo_end_share"],options:[{id:"accept",label:"收下佣钱",hint:"按规矩办",require:{notFlag:"jh:cargo_paid"},gain:{xp:30,silver:60},relation:{who:"carter",value:-2},setFlags:["jh:cargo_paid"],text:"佣钱不少。车夫从那天起再没找你说过话，商会的差事倒是找上门来——换了一批人来谈。"}]}],kh=[{id:"ev_cart",kind:"event",title:"翻倒的货车",text:"路边一辆货车翻在沟里，车辕还是新的。车夫坐在石头上抹汗，见你走近，先按住了腰间的柴刀。",regions:["heifeng"],routes:["road","trail"],weight:10,cooldown:6,options:[{id:"search",label:"先看货物",hint:"可能有所收获，也可能惊动埋伏",gain:{materials:{iron_sand:2},silver:15},text:"麻袋里是铁砂与粗盐。你刚搬下两袋，车辙旁忽然多了几个脚印——你没久留，抱上东西就走。"},{id:"help",label:"帮车夫扶正车辕",hint:"耗些气力，换一个人情",cost:{hp:8},gain:{silver:20,xp:12},setFlags:["help_carter"],relation:{who:"carter",value:1},relationSource:"ev_cart_help",discoverIntel:["jh_cargo"],text:"你和车夫一起把车扶正。他塞给你一小串铜钱，说自己是镇上商会的，日后或许能帮上忙。"},{id:"leave",label:"绕开",hint:"不与陌生人搭话，省些力气",text:"你从沟上绕过去。身后传来车夫吆喝牲口的声音，听来并无异样。"}]},{id:"ev_herbalist",kind:"event",title:"采药人的呼喊",text:"林子里传来断续的呼救声。一个背着药篓的中年人爬在树上，树下两只野狼正绕圈。",regions:["heifeng","yunwu"],routes:["trail","peril"],weight:9,cooldown:5,options:[{id:"fight",label:"引开野狼",hint:"一战",battle:"e_wolf",setFlags:["saved_herbalist"],relation:{who:"herbalist",value:2},text:"你挡在树前。狼群分出一只扑向你。"},{id:"shout",label:"扔石头惊走野狼",hint:"需身法15",require:{minAttr:{key:"agi",value:15}},gain:{xp:10},setFlags:["saved_herbalist"],relation:{who:"herbalist",value:1},text:"你连掷三石，都打在狼鼻上。畜生吃痛，夹尾退进林里。采药人从树上滑下来，连声道谢。"},{id:"track",label:"循兽径绕到狼后",hint:"山里人的法子，不必动手",require:{origin:"hunter"},gain:{xp:16,materials:{hide:1}},setFlags:["saved_herbalist"],relation:{who:"herbalist",value:2},text:"你从下风处的兽径摸过去，一把拽住树上的药篓往反方向抛。狼追着药篓进了林子，采药人趁机爬下来。"},{id:"pass",label:"不惹麻烦",hint:"继续赶路",text:"你退后几步绕开。喊声在身后低下去，你没有回头。"}]},{id:"ev_bridge",kind:"event",title:"断桥",text:"木桥中间塌了半边，桥下是乱石滩。对岸的路更近，绕行则要多花些功夫。",regions:["heifeng","yunwu"],routes:["road","trail"],weight:7,cooldown:6,options:[{id:"jump",label:"踏断木跃过去",hint:"需身法14，失败会磕伤",require:{minAttr:{key:"agi",value:14}},gain:{xp:12},text:"你借断木一踏，落上对岸。鞋底湿了，人没伤。"},{id:"cross_risky",label:"硬踩过去",hint:"有风险",cost:{hp:14},gain:{xp:10},text:"朽木在脚下碎裂，你手脚并用爬上岸，膝盖磕出一道血口，好在骨头没事。"},{id:"detour",label:"绕道而行",hint:"耗些时辰",text:"你沿河绕了半里路，从浅滩过去。多走了些路，倒也无事。"}]},{id:"ev_camp",kind:"event",title:"废弃营地",text:"一片被遗弃的营地，火堆冷透。地上散着几柄断刀，还有半张被雨泡烂的纸。",regions:["heifeng"],routes:["trail","peril"],weight:8,cooldown:6,options:[{id:"read",label:"拾起那张纸",hint:"需悟性6",require:{minAttr:{key:"insight",value:6}},gain:{xp:16,materials:{page:1}},setFlags:["clue_heifeng"],text:"纸上记着几笔货物往来，末尾画了个歪斜的“韩”字。你把纸收好——黑风寨里有人不只在劫道。"},{id:"search",label:"翻找营地",hint:"得些杂物",gain:{materials:{iron_sand:2,hide:1},silver:10},setFlags:["clue_heifeng"],text:"你从灰堆里刨出几块没烧透的铁料和一张兽皮，底下还压着半页账目——上头几次都写着“活物”二字。"}]},{id:"ev_notice",kind:"event",title:"悬赏碑",text:"路口立着一块旧碑，镇上的差役在碑上贴了赏格，风吹得纸角翻卷。",regions:["heifeng"],routes:["road"],weight:6,cooldown:8,options:[{id:"read",label:"记下赏格",hint:"抬升悬赏回报",gain:{xp:8},setFlags:["bounty_seen"],text:"“擒杀黑风寨贼首者，赏银五十两。”你记住了这句话。"},{id:"ignore",label:"继续赶路",text:"你没有细看，沿着官道往前走。"}]},{id:"ev_woodsman",kind:"event",title:"砍柴人",text:"一个老汉蹲在坡上捆柴，见你腰里有家伙，先问了句：“你是要去旧营地那边？”",regions:["heifeng"],routes:["trail"],weight:6,cooldown:8,options:[{id:"ask",label:"向他打听山寨",hint:"得到消息",gain:{xp:12},setFlags:["clue_heifeng"],relation:{who:"woodsman",value:1},discoverIntel:["jh_sand"],text:"“后山有条旧道，直通他们放东西的地方。前些年采药还走，如今没人敢去了。”老汉用柴刀在地上划了个方向。"},{id:"share",label:"分他一块干粮",hint:"耗银5",cost:{silver:5},gain:{xp:8,materials:{hide:1}},relation:{who:"woodsman",value:2},setFlags:["clue_heifeng"],discoverIntel:["jh_sand"],text:"老汉推了两下还是接了，一边吃一边说：“后山有条旧道，直通他们放东西的地方。前些年采药还走，如今没人敢去了。”"}]},{id:"ev_secret",kind:"event",title:"后山旧道",text:"崖壁下果然有一道裂隙，里面积着旧脚印。越往里走，越能听见水声和隐约的人语。",regions:["heifeng"],routes:["peril"],nodes:[3,4,5],requireFlags:["clue_heifeng"],weight:12,cooldown:8,options:[{id:"sneak",label:"沿裂隙潜入",hint:"需身法16，可避开正面守备",require:{minAttr:{key:"agi",value:16}},gain:{xp:24,silver:40,materials:{page:1}},setFlags:["secret_path","clue_yunwu"],discoverIntel:["jh_sand"],text:"你贴着石壁摸进山寨后仓。箱笼里除了银钱，还有一册账本，上头记着往云雾泽送过几批“活物”。"},{id:"force",label:"直接闯进去",hint:"一战",battle:"e_daoke",setFlags:["secret_path"],text:"你踢开仓门。守仓的刀客先愣了一下，随即拔刀。"},{id:"back",label:"记下位置，先退出去",hint:"稳妥",gain:{xp:8},setFlags:["secret_found"],text:"你退出裂隙，把入口的位置记牢。下次可以带够人再来。"}]},{id:"ev_temple",kind:"event",title:"雨夜破庙",text:"雨下得急，你躲进路边破庙。庙里已经有人——一个穿青衫的剑客靠在柱上，左肩有血，手里还攥着剑。",regions:["heifeng","yunwu"],routes:["road","trail"],weight:9,cooldown:10,once:!0,options:[{id:"heal",label:"给他上药",hint:"耗疗伤药1",cost:{items:["heal"]},gain:{xp:20,silver:30},setFlags:["saved_liuqing"],relation:{who:"liuqing",value:3},discoverIntel:["jh_sword"],schedule:{event:"ev_liuqing_letter",delay:6},text:"你撕开他的衣袖敷上药。他看你一眼，说：“在下柳青，欠你一次。”庙外雨声里传来马蹄，他撑起身走了，临走把一枚旧剑穗塞进你手里。"},{id:"guard",label:"替他守夜，收钱",hint:"可能被卷入追兵",gain:{silver:60,xp:14},relation:{who:"liuqing",value:1},discoverIntel:["jh_sword"],schedule:{event:"ev_liuqing_letter",delay:8},text:"你替他把住庙门。后半夜果然有三人提灯而来，见你站在门口，盘桓片刻便走了。天亮时剑客已离开，留下银钱一句“山水有相逢”。"},{id:"ask",label:"先问他来路",hint:"需悟性10",require:{minAttr:{key:"insight",value:10}},gain:{xp:16},setFlags:["doubt_liuqing"],text:"他答得滴水不漏，你却听出两处含糊。你没再追问，也没伸手——他点了点头，算是明白。"},{id:"go",label:"冒雨离开",hint:"不涉恩怨",cost:{hp:6},text:"你退回雨里。走了半里，身后破庙中传来一声短促的剑鸣，你没有回头。"}]},{id:"ev_lost_child",kind:"event",title:"走失的孩子",text:"山道边蹲着个七八岁的孩子，抱着膝盖，说找不到进山的爹了。",regions:["heifeng"],routes:["road","trail"],weight:7,cooldown:8,options:[{id:"escort",label:"送他回镇口",hint:"耗些气力，结善缘",cost:{hp:6},gain:{xp:14,silver:25},relation:{who:"villagers",value:2},setFlags:["helped_child"],text:"你把他送到镇口，孩子娘跑出来连声道谢，塞给你一包铜钱。"},{id:"guide",label:"指路后继续赶路",gain:{xp:6},text:"你指着官道的方向，看他一瘸一拐地走远。"}]},{id:"ev_fog",kind:"event",title:"雾障",text:"雾忽然浓起来，前后都看不到路。水面下像是有什么东西在动。",regions:["yunwu"],weight:10,cooldown:5,options:[{id:"reason",label:"辨水纹认方向",hint:"需悟性14",require:{minAttr:{key:"insight",value:14}},gain:{xp:20},text:"你盯着草叶上的水珠，认出雾是从东边来的。顺风走出半里，路就露出来了。"},{id:"listen",label:"循水声摸索",hint:"耗些气力",cost:{hp:10},gain:{xp:14},text:"你摸着芦苇一步步走，磕了几次膝盖，总算摸上干地。"},{id:"wait",label:"原地不动等雾散",hint:"耗时辰，但稳当",gain:{xp:4},text:"你蹲在草垛上等了大半个时辰，雾果然淡了。"}]},{id:"ev_swamp",kind:"event",title:"毒沼",text:"前路是一片浮着绿沫的泥沼，草根上粘着细小的黑虫。",regions:["yunwu"],weight:9,cooldown:5,options:[{id:"antidote",label:"服药后直穿过去",hint:"需解毒药1",cost:{items:["antidote"]},gain:{xp:16},text:"你含住解毒药再走。泥水没过小腿，出沼时你身上全湿，人却没有发热。"},{id:"through",label:"硬穿过去",hint:"中毒",cost:{hp:12},gain:{xp:10},setFlags:["poisoned"],text:"你踩着草垛硬过。上岸后小腿上起了一片红疹，隐隐发热。"},{id:"around",label:"绕路",hint:"稳妥但耗时辰",gain:{xp:6},text:"你沿沼边走了一整圈，多花了时辰，衣裳干净。"}]},{id:"ev_herb_pick",kind:"event",title:"灵芝与守主",text:"一株紫灵芝长在倒木上，颜色好得不寻常。木下泥里有东西缓缓挪动。",regions:["yunwu"],weight:9,cooldown:6,options:[{id:"fight",label:"先解决泥里的东西",hint:"一战",battle:"e_mang",gain:{materials:{lingzhi:2}},text:"你抽身后退，蟒头跟着抬起。"},{id:"pick",label:"轻手轻脚采走",hint:"需身法20，失败会惊动它",require:{minAttr:{key:"agi",value:20}},gain:{materials:{lingzhi:1},xp:16},text:"你踩着倒木的干处过去，摘下灵芝时手指都没有抖。泥下的东西始终没有抬头。"},{id:"mark",label:"记下位置离开",hint:"留待下次准备",gain:{xp:6},setFlags:["herb_marked"],text:"你记下方位，退出这片浅沼。"}]},{id:"ev_stele",kind:"event",title:"水边古碑",text:"半截石碑泡在水里，字迹被苔藓盖住大半。碑面刻着雷纹，摸上去微微发麻。",regions:["yunwu"],weight:8,cooldown:10,once:!0,options:[{id:"study",label:"细读碑文",hint:"需悟性16",require:{minAttr:{key:"insight",value:16}},gain:{xp:30},setFlags:["learned_yinlei"],text:"你擦掉苔藓，逐字辨认。这是一段引雷的行气法门，写得极简。你在碑前坐到天色发暗，把口诀记全了。"},{id:"copy",label:"抄录带回镇上请教",hint:"需武学残页1",cost:{materials:{page:1}},gain:{xp:20},setFlags:["learned_yinlei"],text:"你把碑文描在残页背面。虽然残缺，行气的次序是清楚的。"},{id:"scholar",label:"照古法逐字拆读",hint:"识字的人看得更快",require:{origin:"scholar"},gain:{xp:26},setFlags:["learned_yinlei"],text:"碑上的字是旧体，缺笔少画，好在你在书铺里见过同样的写法。拆到第三行，行气的路子就通了。"},{id:"leave",label:"看不懂，走了",text:"你把苔藓抹了两把还是认不出几个字，索性离开。"}]},{id:"ev_angler",kind:"event",title:"钓翁",text:"一个老头子坐在竹排上钓鱼，鱼篓空空。他也不急，只看着水面。",regions:["yunwu"],routes:["trail","peril"],weight:6,cooldown:12,once:!0,options:[{id:"talk",label:"陪他坐一会儿",hint:"耗时辰，或有收获",cost:{hp:4},gain:{xp:24},setFlags:["learned_xuanshui"],relation:{who:"angler",value:2},text:"你在他旁边坐下。老人不讲鱼，只讲水：“水不与物争，故能穿石。”说到日头偏西，他把一句玄水诀的口诀丢给你，收竿走了。"},{id:"buy",label:"买他篓里的鱼",hint:"耗银10",cost:{silver:10},gain:{hp:20,xp:6},text:"老人从篓里摸出两条青鱼递给你。你就地生火烤了，吃完身上暖起来。"}]},{id:"ev_wreck",kind:"event",title:"沉船残骸",text:"浅滩上斜着一截船身，木头黑得发亮，船头还系着断绳——这是被凿沉的。",regions:["yunwu"],nodes:[2,3,4,5],weight:9,cooldown:10,options:[{id:"search",label:"进舱看看",hint:"有所收获，也可能有守船的",gain:{xp:22,silver:35,materials:{reed_root:2,venom_sac:1}},setFlags:["wreck_found","clue_luoxia"],discoverIntel:["jh_herb"],text:"舱里堆着空木箱，箱底压着一册湿透的名录，写着“落霞道场”四个字。还有一截玉牌，纹路与你那枚旧玉佩极为相似。"},{id:"strip",label:"只拆些可用的木料",gain:{silver:18,materials:{reed_root:1}},text:"你拆了两块船板换钱，没有往舱里钻。"}]},{id:"ev_reed",kind:"event",title:"芦荡深处",text:"芦苇比人还高，拨开时惊起一群水鸟。滩地里有被人踩过的痕迹。",regions:["yunwu"],routes:["trail","peril"],weight:8,cooldown:6,options:[{id:"dig",label:"顺着痕迹找",hint:"采得药材",gain:{materials:{reed_root:2,lingzhi:1},xp:10},text:"痕迹通向一处隐蔽的浅坑，坑里晒着半干药材，主人不在。你取了些，留了银钱在石头上。"},{id:"fish",label:"安静地捕两条鱼",gain:{hp:15,xp:6},text:"你用手边的东西扎了两条鱼，休息片刻，吃了再走。"}]},{id:"ev_fisher",kind:"event",title:"渔家女",text:"一个年轻女子在滩上收网，见你走来，先把网收紧了：“这片水最近不对劲，你别往深处去。”",regions:["yunwu"],weight:7,cooldown:12,once:!0,options:[{id:"ask",label:"问她水里出了什么事",gain:{xp:18},setFlags:["fisher_quest","clue_luoxia"],relation:{who:"fisher",value:2},discoverIntel:["jh_herb"],text:"“上个月有三条船没回来，捞上来的船底都有凿口。他们说是水匪，可水匪不会连货都不要。”她顿了顿，“你要是往沉船那边去，帮我看看我哥的网还在不在。”"},{id:"buy_net",label:"买她两张旧网",hint:"耗银12",cost:{silver:12},gain:{materials:{reed_root:2},xp:6},relation:{who:"fisher",value:1},text:"她把两张补过的网卷好递给你：“进水前垫着，管用。”"},{id:"leave",label:"点点头走了",text:"你应了一声，没有多问。"}]},{id:"ev_gate",kind:"event",title:"山门旧址",text:"石阶断了三成，山门只剩两根立柱。柱下刻着一行小字：“问道者入，取巧者死。”",regions:["luoxia"],weight:9,cooldown:6,options:[{id:"read",label:"辨认柱上小字",hint:"需悟性20",require:{minAttr:{key:"insight",value:20}},gain:{xp:26},setFlags:["gate_read"],text:"不止一行。下头还有半句被磨平：“……试道者三，过者得传。”你记下这句话。"},{id:"search",label:"在碎石里翻找",gain:{materials:{ruin_shard:1},silver:20},text:"你在碎瓦中拾到一枚残片，边缘锋利，隐有灵气。"}]},{id:"ev_pillar",kind:"event",title:"碑文",text:"甬道尽头立着一方青碑，碑面密密麻麻。字是新的——有人在你之前来过，还抄过一遍。",regions:["luoxia"],nodes:[2,3,4,5],weight:10,cooldown:8,options:[{id:"study",label:"逐段抄读",hint:"需悟性22",require:{minAttr:{key:"insight",value:22}},gain:{xp:40,insight:3},setFlags:["stele_read","clue_trial"],discoverIntel:["jh_shard"],text:"碑上记的是此地旧主的一段自述：他晚年把一门功法拆成三份，分别藏在泽底、山腹与碑后，等一个“不取巧的人”。你抄完最后一行，碑后石壁自己退开了半尺。"},{id:"copy",label:"拓下碑面",hint:"需武学残页2",cost:{materials:{page:2}},gain:{xp:28,insight:2},setFlags:["stele_read","clue_trial"],discoverIntel:["jh_shard"],text:"你把碑文一片片拓在残页上。虽然慢了半日，字句总算都在。碑上说功法拆成三份，等一个“不取巧的人”。"},{id:"leave",label:"看不懂，继续走",text:"你看了两眼，只觉头晕，转身继续往里。"}]},{id:"ev_corridor",kind:"event",title:"机关走廊",text:"走廊两侧墙上密布箭孔，地面的砖块高低不一。前头躺着两具已经干枯的尸骨。",regions:["luoxia"],weight:9,cooldown:6,options:[{id:"step",label:"踩着骨头的落点过去",hint:"需悟性18",require:{minAttr:{key:"insight",value:18}},gain:{xp:30},text:"你看出两具尸骨都停在“安全的砖”上，于是踩着一路过去。箭孔始终没有动静。"},{id:"agile",label:"全力冲过去",hint:"需身法26，失败受伤",require:{minAttr:{key:"agi",value:26}},cost:{hp:10},gain:{xp:26},text:"你贴着墙面飞掠而过，两支箭擦着肩头钉进砖里。"},{id:"force",label:"硬闯",hint:"必有伤损",cost:{hp:30},gain:{xp:20},text:"箭雨泼下来。你护住头脸冲过去，落地时手臂上扎着两支，自己拔了。"}]},{id:"ev_spring",kind:"event",title:"幽泉",text:"石室里有一汪暗泉，水面上浮着淡淡白光，四周静得听不见回声。",regions:["luoxia"],weight:8,cooldown:6,options:[{id:"drink",label:"掬水饮下",hint:"恢复气血灵力",gain:{hp:45,mp:25,xp:12},text:"水下喉清凉，一路的疲惫散了大半。你掬水洗了伤口，再往里走时脚步轻了许多。"},{id:"bottle",label:"灌满水囊",hint:"留待日后",gain:{items:["heal"],materials:{jade_marrow:1},xp:8},text:"你把水囊灌满。泉底泥沙中有几粒玉色的细石，你顺手捞了两颗。"}]},{id:"ev_vault",kind:"event",title:"碑后石室",text:"石壁后是一间窄室，架上摆着几样旧物，落满灰。角落里有一具端坐的骸骨，手边还放着笔。",regions:["luoxia"],nodes:[3,4,5],requireFlags:["stele_read"],weight:14,cooldown:12,options:[{id:"take",label:"取物，向骸骨行礼",gain:{xp:45,items:["w_luoxia_sword"],materials:{jade_marrow:2,ruin_shard:2,page:2},insight:2},setFlags:["vault_open"],text:"你先对着那具骸骨作了个长揖，才去取架上的剑。剑入手很轻，像是终于等着了人。"},{id:"copy",label:"只取笔墨书卷",gain:{xp:30,materials:{page:3},insight:3},setFlags:["vault_open"],text:"你把书卷收好，其余东西原样放着。墙上的字与碑文笔迹一致——是同一个人写的。"}]},{id:"ev_trial",kind:"event",title:"试道",text:"最深的石室中央空无一人，却有一道与你身量相仿的影子慢慢显形。它抬手的姿势，与你自己如出一辙。",regions:["luoxia"],nodes:[3,4,5],requireFlags:["clue_trial"],weight:16,cooldown:10,options:[{id:"fight",label:"应战",hint:"一战，胜则通过试炼",battle:"e_huanying",winFlags:["trial_pass","trial_zhuji"],winText:"影子散去时行了个礼。石室顶上落下细灰，墙上那两个字亮了一瞬又暗下去。你已取得筑基的资格。",text:"你抬手，它也随之抬手。石室里只剩两道呼吸。"},{id:"wait",label:"先退出去，准备再来",gain:{xp:8},text:"你退出石室。影子站在原地没有追来，像是在等。"}]},{id:"b_louluo",kind:"battle",title:"拦路",text:"两个提着破刀的人从石头后站起来，一个往你身后绕，一个笑着伸手：“留下买路钱。”",regions:["heifeng"],weight:12,cooldown:4,enemy:"e_louluo"},{id:"b_wolf",kind:"battle",title:"狼群",text:"草丛一动，三只灰背野狼呈扇形围上来，最矮的那只先扑。",regions:["heifeng"],weight:10,cooldown:4,enemy:"e_wolf"},{id:"b_daoke",kind:"battle",title:"刀客",text:"一个背着长刀的汉子横在路当中，慢慢把刀抽出来：“你走的这条路，是我家的。”",regions:["heifeng"],minRealm:1,weight:10,cooldown:4,enemy:"e_daoke"},{id:"b_hound",kind:"battle",title:"恶犬",text:"一条黑狗从灌木里窜出来，颈上还带着断绳。它不叫，只是压低了身子。",regions:["heifeng"],weight:8,cooldown:4,enemy:"e_hound"},{id:"b_boar",kind:"battle",title:"野猪",text:"松林里有东西重重地喘气。一头赤鬃野猪拱翻矮树，朝你的方向直冲过来。",regions:["heifeng"],routes:["trail","peril"],nodes:[2,3,4,5],minRealm:1,weight:9,cooldown:6,enemy:"e_boar"},{id:"b_boss",kind:"battle",title:"黑风寨头目",text:"寨门口立着一个披铁甲的人，甲面被刀砍过却没裂。他把刀往地上一顿：“哪来的？”",regions:["heifeng"],routes:["peril"],nodes:[3,4,5],minRealm:1,weight:14,cooldown:8,enemy:"e_boss",winFlags:["boss_down","got_account"],winText:"头目倒下时铁甲砸在石上，声音很闷。你从他腰间的匣子里翻出一册账本。"},{id:"b_hanqi",kind:"battle",title:"二当家",text:"一个瘦高男人从树上落下来，刀比人先到：“账本的事，我处理得干净，你还来做什么。”",regions:["heifeng"],routes:["peril"],nodes:[4,5],requireFlags:["got_account"],weight:18,cooldown:10,enemy:"e_hanqi",winFlags:["hanqi_down"],winText:"他退了两步，笑了一声才倒下。刀上那道缺口，和你见过的马车辕木对得上。"},{id:"b_mang",kind:"battle",title:"沼中蟒",text:"水面裂开一道线，一颗覆着青苔的蟒头抬起来，分叉的舌头在雾里探。",regions:["yunwu"],weight:10,cooldown:5,enemy:"e_mang"},{id:"b_chong",kind:"battle",title:"毒虫",text:"耳边一阵嗡响，黑雾般的一团小虫贴着水面卷过来。",regions:["yunwu"],weight:9,cooldown:5,enemy:"e_chong"},{id:"b_shuifei",kind:"battle",title:"水匪",text:"两条小船横在水道上，船头的人拿竹篙点着你的方向：“船钱，或者货。”",regions:["yunwu"],routes:["road","trail"],weight:10,cooldown:5,enemy:"e_shuifei"},{id:"b_yaolu",kind:"battle",title:"妖化鹿",text:"一头鹿立在水中，角上缠着黑气，眼睛已经不像鹿了。它没有逃。",regions:["yunwu"],minRealm:4,weight:9,cooldown:6,enemy:"e_yaolu"},{id:"b_yuanhun",kind:"battle",title:"怨魂",text:"雾里浮出一个人形，衣裳是几十年前的样式，手里还攥着半截船桨。",regions:["yunwu"],routes:["trail","peril"],nodes:[2,3,4,5],minRealm:4,weight:9,cooldown:6,enemy:"e_yuanhun"},{id:"b_jiao",kind:"battle",title:"蛟影",text:"整片水面忽然静了。一道长影从深水里升起，鳞片刮过芦根，像铁片相磨。",regions:["yunwu"],routes:["peril"],nodes:[4,5],minRealm:4,requireFlags:["wreck_found"],weight:16,cooldown:12,enemy:"e_jiao",winFlags:["jiao_down"],winText:"长影沉下去时把整片水搅浑。等水面重新静下，你才看清鳞上嵌着半枚旧玉牌。"},{id:"b_shigui",kind:"battle",title:"石傀",text:"甬道两侧的石人同时转了头。石屑从关节缝里簌簌落下。",regions:["luoxia"],weight:10,cooldown:5,enemy:"e_shigui"},{id:"b_jiguan",kind:"battle",title:"机关傀儡",text:"木与铜拼成的护卫挡在门前，胸腔里传来细密的齿轮声。",regions:["luoxia"],routes:["road","trail"],weight:9,cooldown:5,enemy:"e_jiguan"},{id:"b_jianke",kind:"battle",title:"残魂剑客",text:"一道半透明的身影站在阶上，剑尖点地。它行了半个礼，然后起手。",regions:["luoxia"],routes:["trail","peril"],nodes:[2,3,4,5],weight:10,cooldown:6,enemy:"e_jianke"},{id:"b_zuibeiren",kind:"battle",title:"守碑人",text:"碑前浮起一缕神念，声音很轻：“取巧者死。你是哪一种？”",regions:["luoxia"],routes:["peril"],nodes:[3,4,5],requireFlags:["gate_read"],weight:13,cooldown:8,enemy:"e_zuibeiren",winFlags:["guardian_down"]},{id:"b_shouwei",kind:"battle",title:"遗迹守卫",text:"最后一道门后站着真正的守门人。它没有说一句话，只是把手按在了剑柄上。",regions:["luoxia"],nodes:[4,5],requireFlags:["clue_trial"],minRealm:6,weight:16,cooldown:12,enemy:"e_shouwei",winFlags:["guard_down"],winText:"守卫的剑断了。门后没有宝物，只有一方空着的蒲团，和墙上“问道”两个字。"},{id:"ev_liuqing_letter",kind:"event",title:"柳青的来信",text:"客栈掌柜叫住你，递来一封信，封口压着一枚小剑印。",regions:[],town:!0,scheduled:!0,weight:0,options:[{id:"open",label:"拆信",gain:{xp:10},setFlags:["liuqing_invite"],discoverIntel:["jh_sword"],schedule:{event:"ev_liuqing_meeting",delay:4},text:"“三日后，城北旧祠堂，有一场剑会。你若来，我教你几手。”落款是柳青。"},{id:"later",label:"先收起来",gain:{xp:4},setFlags:["liuqing_invite"],discoverIntel:["jh_sword"],schedule:{event:"ev_liuqing_meeting",delay:6},text:"你把信收进怀里。信上的剑印摸起来是刻上去的。"}]},{id:"ev_liuqing_meeting",kind:"event",title:"剑会",text:"旧祠堂里点着三炷香。柳青把一柄木剑丢给你：“今天不伤人，只学怎么走。”",regions:[],town:!0,scheduled:!0,requireFlags:["liuqing_invite"],weight:0,options:[{id:"learn",label:"认真学",hint:"习得疾风剑诀",cost:{hp:12},gain:{xp:25},setFlags:["learned_jifeng"],relation:{who:"liuqing",value:2},text:"练到深夜，你把三式走位记熟了。柳青收起木剑：“你学得快。只是剑意不在快，在准。”"},{id:"spar",label:"先与他比一场",hint:"有伤损，但收获更多",cost:{hp:25},gain:{xp:40},setFlags:["learned_jifeng"],relation:{who:"liuqing",value:3},text:"你被击退四次，第五次终于碰到他的衣角。柳青笑了：“够了。”临走把一卷剑诀留给你。"},{id:"decline",label:"婉拒",gain:{xp:6},text:"你说自己另有要事。柳青也不勉强，只让你保重。"}]},{id:"ev_yaopo",kind:"event",title:"药婆的托付",text:"药铺的老妇人叫住你，手里捏着一根干枯的草：“你走过云雾泽？帮我看看，这草是在哪儿采的。”",regions:[],town:!0,weight:8,cooldown:40,options:[{id:"accept",label:"答应替她找",gain:{xp:15},setFlags:["yaopo_quest"],relation:{who:"yaopo",value:2},relationSource:"ev_yaopo",discoverIntel:["jh_garden"],text:"她把草递给你：“这叫还魂草，长在水边倒木上。我年轻时见过一次。”"},{id:"trade",label:"用灵芝跟她换药",hint:"需灵芝1",cost:{materials:{lingzhi:1}},gain:{items:["heal","heal","antidote"],xp:10},relation:{who:"yaopo",value:1},relationSource:"ev_yaopo",text:"她仔细看过你带来的灵芝，很是满意，转身配了三包药塞给你。"}]},{id:"ev_merchant",kind:"event",title:"商会的差事",text:"镇上商会的管事拦住你：“有批货要送到云雾泽边上的码头，路上不太平，缺个能打的人。”",regions:[],town:!0,weight:8,cooldown:20,options:[{id:"take",label:"接下这趟护送",hint:"耗些气力，报酬不薄",cost:{hp:15},gain:{silver:70,xp:24},setFlags:["escort_done"],relation:{who:"carter",value:1},discoverIntel:["jh_cargo"],text:"一路没什么事，只在浅滩遇上两个探路的小贼，见你带刀就散了。管事如约付钱。"},{id:"bid",label:"讨价还价",hint:"需悟性12",require:{minAttr:{key:"insight",
